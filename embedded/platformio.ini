[platformio]
default_envs = esp32_s3


; ============================================================
; NORMAL DURSUN EMICE
; ============================================================

[env:esp32_s3]

platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip

board = esp32-s3-devkitc1-n16r8
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.filesystem = littlefs
board_build.partitions = partitions_sr.csv

extra_scripts =
    post:scripts/flash_sr_models.py

build_src_filter =
    +<*>
    -<afe_test_main.cpp>
    -<afe_compare_main.cpp>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    earlephilhower/ESP8266Audio @ 2.4.1


; ============================================================
; ESP-SR VAD / AFE TEST
; ============================================================

[env:afe_test]

platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip

board = esp32-s3-devkitc1-n16r8
